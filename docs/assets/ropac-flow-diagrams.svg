<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#121A2E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34D399"/>
    </marker>
    <marker id="arrowV" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1280" height="1100" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accentGrad)"/>

  <text x="64" y="52" fill="#F1F5F9" font-family="system-ui,sans-serif" font-size="32" font-weight="700">RoPac - System design flows</text>
  <text x="64" y="82" fill="#94A3B8" font-family="system-ui,sans-serif" font-size="15">Architecture | Normal chat | RAG chat | Train index | localhost only</text>
  <rect x="900" y="32" width="316" height="36" rx="18" fill="#22D3EE22" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="1058" y="56" text-anchor="middle" fill="#22D3EE" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Retrieve - Augment - Generate</text>

  <g font-family="system-ui,sans-serif">
    <rect x="40" y="110" width="90" height="52" rx="10" fill="#1E3A2F" stroke="#34D399" stroke-width="2"/>
    <text x="85" y="134" text-anchor="middle" fill="#A7F3D0" font-size="12" font-weight="700">User</text>
    <text x="85" y="150" text-anchor="middle" fill="#6EE7B7" font-size="9">Chat / Train</text>

    <rect x="148" y="110" width="100" height="52" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
    <text x="198" y="134" text-anchor="middle" fill="#F1F5F9" font-size="12" font-weight="700">Flutter</text>
    <text x="198" y="150" text-anchor="middle" fill="#94A3B8" font-size="9">RoPac.app</text>

    <rect x="266" y="110" width="100" height="52" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="316" y="134" text-anchor="middle" fill="#F1F5F9" font-size="12" font-weight="700">bridge.py</text>
    <text x="316" y="150" text-anchor="middle" fill="#94A3B8" font-size="9">JSON IPC</text>

    <rect x="384" y="110" width="120" height="52" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
    <text x="444" y="134" text-anchor="middle" fill="#F1F5F9" font-size="12" font-weight="700">assistant.py</text>
    <text x="444" y="150" text-anchor="middle" fill="#C4B5FD" font-size="9">prompt / memory</text>

    <rect x="522" y="110" width="110" height="52" rx="10" fill="#312E81" stroke="#A78BFA" stroke-width="2"/>
    <text x="577" y="134" text-anchor="middle" fill="#EDE9FE" font-size="12" font-weight="700">knowledge.py</text>
    <text x="577" y="150" text-anchor="middle" fill="#C4B5FD" font-size="9">RAG retrieve</text>

    <rect x="650" y="110" width="100" height="52" rx="10" fill="#164E63" stroke="#22D3EE" stroke-width="2"/>
    <text x="700" y="134" text-anchor="middle" fill="#F1F5F9" font-size="12" font-weight="700">Ollama</text>
    <text x="700" y="150" text-anchor="middle" fill="#67E8F9" font-size="9">chat + embed</text>

    <rect x="768" y="110" width="130" height="52" rx="10" fill="#3B2F1A" stroke="#FBBF24" stroke-width="2"/>
    <text x="833" y="134" text-anchor="middle" fill="#FDE68A" font-size="12" font-weight="700">data/</text>
    <text x="833" y="150" text-anchor="middle" fill="#D6D3D1" font-size="9">memory / knowledge</text>
  </g>

  <line x1="130" y1="136" x2="144" y2="136" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="248" y1="136" x2="262" y2="136" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="366" y1="136" x2="380" y2="136" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="504" y1="136" x2="518" y2="136" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="632" y1="136" x2="646" y2="136" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="444" y1="162" x2="444" y2="200" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arrowV)"/>
  <line x1="444" y1="200" x2="833" y2="200" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="220" width="580" height="300" rx="14" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <text x="64" y="252" fill="#34D399" font-family="system-ui,sans-serif" font-size="15" font-weight="700">CASE A - Normal chat (no document RAG)</text>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#E2E8F0">
    <rect x="64" y="272" width="520" height="36" rx="8" fill="#1E293B"/>
    <text x="80" y="294">1 User message - bridge chat_stream - assistant.chat_stream</text>
    <rect x="64" y="318" width="520" height="36" rx="8" fill="#1E3A2F"/>
    <text x="80" y="340">2 should_run_document_retrieval? NO (hi / thanks / no docs)</text>
    <rect x="64" y="364" width="520" height="36" rx="8" fill="#1E293B"/>
    <text x="80" y="386">3 load memory.json - OWNER PROFILE in system prompt</text>
    <rect x="64" y="410" width="520" height="36" rx="8" fill="#1E293B"/>
    <text x="80" y="432">4 + chat history + user message</text>
    <rect x="64" y="456" width="520" height="48" rx="8" fill="#164E63"/>
    <text x="80" y="478">5 Ollama stream - NDJSON - Flutter UI</text>
    <text x="80" y="494" fill="#67E8F9">No TRAINED DOCUMENTS block</text>
  </g>

  <rect x="660" y="220" width="580" height="300" rx="14" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
  <text x="684" y="252" fill="#A78BFA" font-family="system-ui,sans-serif" font-size="15" font-weight="700">CASE B - RAG (retrieve / augment / generate)</text>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#E2E8F0">
    <rect x="684" y="272" width="520" height="36" rx="8" fill="#1E293B"/>
    <text x="700" y="294">1 should_run_document_retrieval? YES</text>
    <rect x="684" y="318" width="520" height="36" rx="8" fill="#312E81"/>
    <text x="700" y="340">2 embed query - cosine vs chunks - floor 0.28</text>
    <rect x="684" y="364" width="520" height="36" rx="8" fill="#312E81"/>
    <text x="700" y="386">3 top 4 chunks - labels [file#chunk] - keyword fallback</text>
    <rect x="684" y="410" width="520" height="36" rx="8" fill="#4C1D95"/>
    <text x="700" y="432">4 TRAINED DOCUMENTS + PROFILE + history</text>
    <rect x="684" y="456" width="520" height="48" rx="8" fill="#164E63"/>
    <text x="700" y="478">5 Ollama answer from retrieved excerpts</text>
    <text x="700" y="494" fill="#67E8F9">Cite [filename#chunk] when quoting</text>
  </g>

  <rect x="40" y="540" width="1200" height="120" rx="14" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
  <text x="64" y="572" fill="#FBBF24" font-family="system-ui,sans-serif" font-size="15" font-weight="700">TRAIN FLOW - build index</text>
  <text x="64" y="600" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12">File + password - ingest - chunk - knowledge/id.json (encrypted)</text>
  <text x="64" y="622" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12">- embed_texts - id.embeddings.json - index.json - optional facts to memory.json</text>
  <text x="64" y="644" fill="#94A3B8" font-family="system-ui,sans-serif" font-size="11">At question time: retrieve top chunks only, never full file</text>

  <rect x="40" y="680" width="1200" height="100" rx="14" fill="#0F172A" stroke="#334155"/>
  <text x="64" y="712" fill="#22D3EE" font-family="system-ui,sans-serif" font-size="15" font-weight="700">DATA</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="64" y="728" width="220" height="40" rx="6" fill="#3B2F1A" stroke="#FBBF24"/>
    <text x="76" y="746" fill="#FDE68A" font-weight="600">memory.json</text>
    <text x="76" y="760" fill="#D6D3D1">facts - always in prompt</text>
    <rect x="300" y="728" width="280" height="40" rx="6" fill="#312E81" stroke="#A78BFA"/>
    <text x="312" y="746" fill="#EDE9FE" font-weight="600">knowledge/*.json + embeddings</text>
    <text x="312" y="760" fill="#C4B5FD">chunks + vectors - RAG only</text>
    <rect x="596" y="728" width="200" height="40" rx="6" fill="#1E293B" stroke="#64748B" stroke-dasharray="4 3"/>
    <text x="608" y="746" fill="#CBD5E1" font-weight="600">.vault_session/</text>
    <text x="608" y="760" fill="#94A3B8">temp decrypt - quit wipes</text>
    <rect x="812" y="728" width="200" height="40" rx="6" fill="#1E293B" stroke="#64748B"/>
    <text x="824" y="746" fill="#CBD5E1" font-weight="600">chat_history.jsonl</text>
    <text x="824" y="760" fill="#94A3B8">append log - not encrypted</text>
    <rect x="1028" y="728" width="180" height="40" rx="6" fill="#164E63" stroke="#22D3EE"/>
    <text x="1040" y="746" fill="#67E8F9" font-weight="600">Ollama :11434</text>
    <text x="1040" y="760" fill="#A5F3FC">roPac + nomic-embed</text>
  </g>

  <rect x="40" y="800" width="1200" height="270" rx="14" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="1.5"/>
  <text x="64" y="832" fill="#F1F5F9" font-family="system-ui,sans-serif" font-size="15" font-weight="700">DECISION - which path?</text>

  <polygon points="640,860 720,900 640,940 560,900" fill="#0E7490" stroke="#22D3EE" stroke-width="2"/>
  <text x="640" y="898" text-anchor="middle" fill="#F0FDFA" font-family="system-ui,sans-serif" font-size="10" font-weight="600">RAG?</text>

  <text x="200" y="900" text-anchor="middle" fill="#34D399" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Normal</text>
  <text x="1080" y="900" text-anchor="middle" fill="#A78BFA" font-family="system-ui,sans-serif" font-size="12" font-weight="600">RAG</text>

  <line x1="560" y1="900" x2="280" y2="900" stroke="#34D399" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="720" y1="900" x2="1000" y2="900" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="960" width="480" height="90" rx="10" fill="#1E3A2F" stroke="#34D399"/>
  <text x="96" y="984" fill="#A7F3D0" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Prompt: rules + OWNER PROFILE + history</text>
  <text x="96" y="1004" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="11">Ollama - reply</text>

  <rect x="720" y="960" width="480" height="90" rx="10" fill="#4C1D95" stroke="#A78BFA"/>
  <text x="736" y="984" fill="#EDE9FE" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Prompt: + TRAINED DOCUMENTS [file#chunk]</text>
  <text x="736" y="1004" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="11">Ollama - reply with citations</text>

  <text x="640" y="1078" text-anchor="middle" fill="#64748B" font-family="system-ui,sans-serif" font-size="11">docs/system-design-flow.md</text>
</svg>
